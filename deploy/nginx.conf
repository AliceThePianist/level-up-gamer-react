server {
    listen 80;
    server_name _;
    root /var/www/levelup;
    index index.html;

    client_max_body_size 6m;

    location /api/ {
        # Sin URI adicional, Nginx conserva /api al reenviar la solicitud.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger y sus recursos llegan a Spring Boot, sin pasar por React Router.
    # En producción requieren SWAGGER_ENABLED=true en el entorno del backend.
    location ~ ^/(swagger-ui(/|\.html$)|v3/api-docs($|/|\.yaml$)) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /catalogo/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
